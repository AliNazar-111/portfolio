<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151a24"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="mark" x1="20" y1="12" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- rounded dark tile -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#8b5cf6" stroke-opacity="0.28" stroke-width="1"/>

  <!-- ambient glow behind mark -->
  <ellipse cx="32" cy="30" rx="24" ry="24" fill="url(#glow)"/>

  <!-- soft halo of the diamond -->
  <path d="M32 12 L50 32 L32 52 L14 32 Z" fill="url(#mark)" opacity="0.35" filter="url(#soft)"/>

  <!-- brand diamond -->
  <path d="M32 14 L48 32 L32 50 L16 32 Z" fill="url(#mark)"/>

  <!-- inner facet highlight -->
  <path d="M32 14 L48 32 L32 32 Z" fill="#ffffff" opacity="0.22"/>
  <path d="M32 14 L16 32 L32 32 Z" fill="#ffffff" opacity="0.10"/>

  <!-- center core -->
  <circle cx="32" cy="32" r="4.4" fill="#0b0d12" opacity="0.85"/>
  <circle cx="32" cy="32" r="2.1" fill="#e9e2ff"/>
</svg>
